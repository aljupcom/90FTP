<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>90FTP Terminal</title>
  <style>
    /* __XTERM_CSS__ */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #cbd5e1;
      overflow: hidden;
      font-family: Consolas, "Lucida Console", "Courier New", monospace;
    }
    .terminal-header-bar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #09090b;
      border-bottom: 1px solid #27272a;
      padding: 0 8px;
      user-select: none;
      box-sizing: border-box;
      z-index: 100;
    }
    .quick-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .quick-btn {
      background: #18181b;
      color: #94a3b8;
      border: 1px solid #27272a;
      border-radius: 4px;
      font-size: 11.5px;
      padding: 3px 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .quick-btn:hover {
      background: #27272a;
      color: #f8fafc;
      border-color: #38bdf8;
    }
    .quick-btn.history-btn {
      border-color: #3b82f6;
      color: #60a5fa;
    }
    .quick-btn.history-btn:hover {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
    }
    .quick-dropdown-container {
      position: relative;
    }
    .quick-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      min-width: 210px;
      z-index: 999;
      padding: 4px 0;
    }
    .quick-menu.right-aligned {
      left: auto;
      right: 0;
    }
    .quick-menu.active {
      display: block;
    }
    .quick-menu-header {
      padding: 4px 10px;
      font-size: 10.5px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .quick-menu-item {
      padding: 6px 10px;
      font-size: 12px;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.12s ease;
    }
    .quick-menu-item:hover {
      background: #1e293b;
      color: #38bdf8;
    }
    .quick-menu-item.danger:hover {
      background: #450a0a;
      color: #f87171;
    }
    .quick-menu-separator {
      height: 1px;
      background: #1f2937;
      margin: 3px 0;
    }
    .recent-list {
      max-height: 220px;
      overflow-y: auto;
    }
    .icon-sm {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }
    #terminalContainer {
      width: 100%;
      height: calc(100% - 32px);
      box-sizing: border-box;
      padding: 4px 6px;
    }
    .xterm {
      height: 100%;
      padding: 0;
    }
    .xterm-viewport {
      background-color: #000000 !important;
    }
  </style>
</head>
<body>
  <div class="terminal-header-bar">
    <div class="quick-group">
      <button class="quick-btn" title="Restart LiteSpeed Web Server" onclick="executeQuick('systemctl restart lsws')">
        <svg class="icon-sm" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>Restart LSWS</span>
      </button>

      <button class="quick-btn" title="Restart CyberPanel Service" onclick="executeQuick('systemctl restart lscpd')">
        <svg class="icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Restart Panel</span>
      </button>

      <button class="quick-btn" title="Restart MariaDB Database" onclick="executeQuick('systemctl restart mariadb')">
        <svg class="icon-sm" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        <span>Restart MariaDB</span>
      </button>

      <div class="quick-dropdown-container">
        <button class="quick-btn" onclick="toggleDropdown('sysDropdown')">
          <svg class="icon-sm" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>System</span> ▾
        </button>
        <div id="sysDropdown" class="quick-menu">
          <div class="quick-menu-header">System Diagnostics</div>
          <div class="quick-menu-item" onclick="executeQuick('df -h')">💾 Disk Space (df -h)</div>
          <div class="quick-menu-item" onclick="executeQuick('free -m')">🧠 Memory Usage (free -m)</div>
          <div class="quick-menu-item" onclick="executeQuick('uptime')">⏱️ System Uptime & Load</div>
          <div class="quick-menu-item" onclick="executeQuick('top -b -n 1 | head -n 20')">📊 Top Processes</div>
          <div class="quick-menu-item" onclick="executeQuick('systemctl restart redis')">⚡ Restart Redis</div>
          <div class="quick-menu-separator"></div>
          <div class="quick-menu-item danger" onclick="confirmReboot()">⚠️ Reboot Server</div>
        </div>
      </div>
    </div>

    <div class="quick-group">
      <div class="quick-dropdown-container">
        <button class="quick-btn history-btn" onclick="toggleDropdown('recentDropdown')">
          <svg class="icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
          <span>Recent</span> ▾
        </button>
        <div id="recentDropdown" class="quick-menu right-aligned">
          <div class="quick-menu-header">Recent Commands</div>
          <div id="recentList" class="recent-list"></div>
          <div class="quick-menu-separator"></div>
          <div class="quick-menu-item" onclick="clearCommandHistory()" style="color:#f87171;">🗑️ Clear History</div>
        </div>
      </div>

      <button class="quick-btn" title="Clear Screen" onclick="executeQuick('clear')">
        <svg class="icon-sm" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 4v6m4-6v6"/></svg>
        <span>Clear</span>
      </button>
    </div>
  </div>

  <div id="terminalContainer"></div>

  <script>
    // __XTERM_JS__
  </script>
  <script>
    // __XTERM_FIT_JS__
  </script>
  <script>
    const HISTORY_STORAGE_KEY = '90ftp_native_terminal_history';
    let term = null;
    let fitAddon = null;
    let currentCwd = '~';
    let currentMode = 'remote';
    let currentHost = 'LocalPC';
    let currentUser = 'root';
    let sessionId = 'native_term_1';
    let lineBuffer = '';
    let commandHistory = loadCommandHistory();
    let historyIdx = -1;
    let isBusy = false;

    function loadCommandHistory() {
      try {
        const stored = localStorage.getItem(HISTORY_STORAGE_KEY);
        if (stored) {
          const arr = JSON.parse(stored);
          if (Array.isArray(arr)) {
            return arr;
          }
        }
      } catch (_) {}
      return [];
    }

    function saveCommandToHistory(cmd) {
      if (!cmd || !cmd.trim()) return;
      const trimmed = cmd.trim();
      const last = commandHistory[commandHistory.length - 1];
      if (last !== trimmed) {
        commandHistory.push(trimmed);
        if (commandHistory.length > 200) {
          commandHistory = commandHistory.slice(-100);
        }
        try {
          localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(commandHistory));
        } catch (_) {}
      }
      renderRecentMenu();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJsString(str) {
      if (!str) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.quick-menu').forEach(el => el.classList.remove('active'));
    }

    function toggleDropdown(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const isOpen = el.classList.contains('active');
      closeAllDropdowns();
      if (!isOpen) {
        if (id === 'recentDropdown') {
          renderRecentMenu();
        }
        el.classList.add('active');
      }
    }

    window.addEventListener('click', (e) => {
      if (!e.target.closest('.quick-dropdown-container')) {
        closeAllDropdowns();
      }
    });

    function renderRecentMenu() {
      const container = document.getElementById('recentList');
      if (!container) return;
      if (!commandHistory || commandHistory.length === 0) {
        container.innerHTML = '<div style="padding:6px 10px; color:#64748b; font-size:11px;">No recent commands</div>';
        return;
      }
      const reversed = [...commandHistory].reverse().slice(0, 25);
      container.innerHTML = reversed.map((c, i) => `
        <div class="quick-menu-item" onclick="executeQuick('${escapeJsString(c)}')">
          <span style="color:#64748b; font-size:10px;">${i + 1}.</span>
          <span style="font-family:monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px;">${escapeHtml(c)}</span>
        </div>
      `).join('');
    }

    function clearCommandHistory() {
      closeAllDropdowns();
      commandHistory = [];
      try {
        localStorage.removeItem(HISTORY_STORAGE_KEY);
      } catch (_) {}
      renderRecentMenu();
    }

    function executeQuick(cmd) {
      closeAllDropdowns();
      if (isBusy || !term) return;
      if (lineBuffer.length > 0) {
        while (lineBuffer.length > 0) {
          term.write('\b \b');
          lineBuffer = lineBuffer.slice(0, -1);
        }
      }
      lineBuffer = cmd;
      term.write(cmd + '\r\n');
      lineBuffer = '';
      historyIdx = -1;
      saveCommandToHistory(cmd);
      runCommand(cmd);
    }

    function confirmReboot() {
      closeAllDropdowns();
      if (confirm("Are you sure you want to reboot the remote server now?")) {
        executeQuick('reboot');
      }
    }

    function applyParams(p) {
      if (!p) return;
      if (p.cwd && String(p.cwd).trim()) currentCwd = String(p.cwd).trim();
      if (p.host && String(p.host).trim()) currentHost = String(p.host).trim();
      if (p.user && String(p.user).trim()) currentUser = String(p.user).trim();
      if (p.mode && String(p.mode).trim()) currentMode = String(p.mode).trim();
      if (p.session_id && String(p.session_id).trim()) sessionId = String(p.session_id).trim();
    }

    if (window.__INIT_PARAMS__) {
      applyParams(window.__INIT_PARAMS__);
    }

    window.initTerminal = function(params) {
      if (params) {
        applyParams(params);
      }
      if (!term) {
        setupXterm();
      } else {
        document.title = currentUser + '@' + currentHost + ':' + currentCwd + ' - 90FTP Native Terminal';
        term.writeln('\x1b[1;36m======================================================================\x1b[0m');
        term.writeln('\x1b[1;32m  Connected: ' + currentUser + '@' + currentHost + ' | Directory: ' + currentCwd + '\x1b[0m');
        term.writeln('\x1b[1;36m======================================================================\x1b[0m');
        lineBuffer = '';
        printPrompt();
      }
    };

    function setupXterm() {
      if (term) return;
      if (window.__INIT_PARAMS__) {
        applyParams(window.__INIT_PARAMS__);
      }
      document.title = currentUser + '@' + currentHost + ':' + currentCwd + ' - 90FTP Native Terminal';
      const container = document.getElementById('terminalContainer');
      term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontSize: 13.5,
        fontFamily: 'Consolas, "Lucida Console", "Courier New", monospace',
        fontWeight: 'normal',
        fontWeightBold: 'bold',
        lineHeight: 1.05,
        theme: {
          background: '#000000',
          foreground: '#d1d5db',
          cursor: '#22c55e',
          cursorAccent: '#000000',
          selectionBackground: 'rgba(56, 189, 248, 0.35)',
          black: '#000000',
          red: '#ef4444',
          green: '#22c55e',
          yellow: '#eab308',
          blue: '#38bdf8',
          magenta: '#c084fc',
          cyan: '#06b6d4',
          white: '#f9fafb',
          brightBlack: '#6b7280',
          brightRed: '#f87171',
          brightGreen: '#4ade80',
          brightYellow: '#fde047',
          brightBlue: '#60a5fa',
          brightMagenta: '#d8b4fe',
          brightCyan: '#22d3ee',
          brightWhite: '#ffffff'
        },
        convertEol: true,
        scrollback: 10000
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(container);
      setTimeout(() => {
        try {
          fitAddon.fit();
          if (term) {
            sendIpc('terminal_resize', {
              session_id: sessionId,
              cols: term.cols,
              rows: term.rows
            });
          }
        } catch (_) {}
      }, 50);

      window.addEventListener('resize', () => {
        if (fitAddon) {
          try {
            fitAddon.fit();
            if (term) {
              sendIpc('terminal_resize', {
                session_id: sessionId,
                cols: term.cols,
                rows: term.rows
              });
            }
          } catch (_) {}
        }
      });

      // Clean, elegant PuTTY banner without engine label
      term.writeln('\x1b[1;36m======================================================================\x1b[0m');
      term.writeln('\x1b[1;32m  Session: ' + currentUser + '@' + currentHost + ' | Directory: ' + currentCwd + '\x1b[0m');
      term.writeln('\x1b[1;36m======================================================================\x1b[0m');
      printPrompt();

      // Attach key event handler to prevent WebView2 accelerator stealing
      term.attachCustomKeyEventHandler(e => {
        // Allow clipboard actions: Ctrl+Shift+C / Ctrl+Shift+V
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.key === 'V' || e.key === 'v')) {
          return false;
        }
        // When busy (running nano, htop, etc.), block WebView browser defaults so Ctrl keys reach xterm
        if (isBusy && e.ctrlKey) {
          e.preventDefault();
          return true;
        }
        return true;
      });

      // Keyboard input
      term.onData(data => {
        if (isBusy) {
          // Direct interactive forwarding to remote SSH / process (nano, htop, top, vi, sudo prompts, Ctrl+C, etc.)
          sendIpc('terminal_input', {
            session_id: sessionId,
            data: data
          });
          return;
        }

        if (data === '\r') {
          term.write('\r\n');
          const cmd = lineBuffer.trim();
          lineBuffer = '';
          historyIdx = -1;
          if (cmd) {
            saveCommandToHistory(cmd);
            runCommand(cmd);
          } else {
            printPrompt();
          }
        } else if (data === '\u007F') {
          if (lineBuffer.length > 0) {
            lineBuffer = lineBuffer.slice(0, -1);
            term.write('\b \b');
          }
        } else if (data === '\u0003') {
          term.write('^C\r\n');
          lineBuffer = '';
          historyIdx = -1;
          printPrompt();
        } else if (data === '\u0017') {
          deleteWordBackwards();
        } else if (data === '\u000c') {
          term.clear();
          printPrompt();
        } else if (data === '\x1b[A') {
          if (commandHistory.length > 0) {
            if (historyIdx === -1) historyIdx = commandHistory.length - 1;
            else if (historyIdx > 0) historyIdx--;
            replaceCurrentLine(commandHistory[historyIdx] || '');
          }
        } else if (data === '\x1b[B') {
          if (historyIdx !== -1) {
            if (historyIdx < commandHistory.length - 1) {
              historyIdx++;
              replaceCurrentLine(commandHistory[historyIdx] || '');
            } else {
              historyIdx = -1;
              replaceCurrentLine('');
            }
          }
        } else if (data >= ' ' || data === '\t') {
          lineBuffer += data;
          term.write(data);
        }
      });
    }

    function printPrompt() {
      if (!term) return;
      const userColor = currentMode === 'remote' ? '\x1b[32m' : '\x1b[35m';
      const sep = currentMode === 'remote' ? '$' : '>';
      term.write(userColor + currentUser + '@' + currentHost + '\x1b[0m:\x1b[34m' + currentCwd + '\x1b[0m' + sep + ' ');
    }

    function replaceCurrentLine(newStr) {
      if (!term) return;
      while (lineBuffer.length > 0) {
        term.write('\b \b');
        lineBuffer = lineBuffer.slice(0, -1);
      }
      lineBuffer = newStr;
      term.write(newStr);
    }

    function deleteWordBackwards() {
      if (!term || lineBuffer.length === 0) return;
      let idx = lineBuffer.length - 1;
      while (idx >= 0 && lineBuffer[idx] === ' ') idx--;
      while (idx >= 0 && lineBuffer[idx] !== ' ') idx--;
      const newLen = idx + 1;
      const charsToDelete = lineBuffer.length - newLen;
      for (let i = 0; i < charsToDelete; i++) {
        term.write('\b \b');
      }
      lineBuffer = lineBuffer.slice(0, newLen);
    }

    // Keyboard accelerators protection
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey) {
        if (['w', 'W', 'n', 'N', 't', 'T', 'q', 'Q', 'o', 'O', 'p', 'P', 'f', 'F', 'r', 'R'].includes(e.key)) {
          e.preventDefault();
          e.stopPropagation();
          if (!isBusy && (e.key === 'w' || e.key === 'W')) {
            deleteWordBackwards();
          }
          return false;
        }
      }
    });

    function sendIpc(action, payload) {
      const id = 'req_' + Math.random().toString(36).substring(2, 9);
      const msg = JSON.stringify({ id, action, payload });
      if (window.ipc && window.ipc.postMessage) {
        window.ipc.postMessage(msg);
      } else if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(msg);
      }
    }

    function runCommand(cmd) {
      if (cmd === 'clear') {
        term.clear();
        printPrompt();
        return;
      }
      if (fitAddon) {
        try { fitAddon.fit(); } catch (_) {}
      }
      isBusy = true;
      sendIpc('terminal_exec', {
        command: cmd,
        cwd: currentCwd,
        mode: currentMode,
        session_id: sessionId,
        cols: term ? term.cols : 100,
        rows: term ? term.rows : 30
      });
    }

    window.onTerminalStream = function(sId, text) {
      if (!term || !text) return;
      const pwdIdx = text.indexOf('__90FTP_PWD__');
      const clean = pwdIdx !== -1 ? text.substring(0, pwdIdx) : text;
      if (clean) {
        term.write(clean);
      }
    };

    window.onTerminalDone = function(sId, newCwd, exitCode) {
      isBusy = false;
      lineBuffer = '';
      historyIdx = -1;
      if (newCwd && newCwd.trim()) {
        currentCwd = newCwd.trim();
        document.title = currentUser + '@' + currentHost + ':' + currentCwd + ' - 90FTP Native Terminal';
      }
      if (term) {
        if (term.buffer && term.buffer.active && term.buffer.active.cursorX !== 0) {
          term.write('\r\n');
        }
        printPrompt();
      }
    };

    // Auto-setup on load
    window.addEventListener('DOMContentLoaded', () => {
      if (window.__INIT_PARAMS__) {
        applyParams(window.__INIT_PARAMS__);
      }
      setupXterm();
    });
  </script>
</body>
</html>
