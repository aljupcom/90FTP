<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>90FTP Terminal</title>
  <style>
    /* __XTERM_CSS__ */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #cbd5e1;
      overflow: hidden;
      font-family: Consolas, "Lucida Console", "Courier New", monospace;
    }
    #terminalContainer {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 4px;
    }
    .xterm {
      height: 100%;
      padding: 0;
    }
    .xterm-viewport {
      background-color: #000000 !important;
    }
  </style>
</head>
<body>
  <div id="terminalContainer"></div>

  <script>
    // __XTERM_JS__
  </script>
  <script>
    // __XTERM_FIT_JS__
  </script>
  <script>
    let term = null;
    let fitAddon = null;
    let currentCwd = '~';
    let currentMode = 'remote';
    let currentHost = 'remote-host';
    let currentUser = 'root';
    let sessionId = 'native_term_1';
    let lineBuffer = '';
    let commandHistory = [];
    let historyIdx = -1;
    let isBusy = false;

    window.initTerminal = function(params) {
      if (params) {
        if (params.cwd) currentCwd = params.cwd;
        if (params.host) currentHost = params.host;
        if (params.user) currentUser = params.user;
        if (params.mode) currentMode = params.mode;
        if (params.session_id) sessionId = params.session_id;
      }
      setupXterm();
    };

    function setupXterm() {
      if (term) return;
      const container = document.getElementById('terminalContainer');
      term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontSize: 13.5,
        fontFamily: 'Consolas, "Lucida Console", "Courier New", monospace',
        fontWeight: 'normal',
        fontWeightBold: 'bold',
        lineHeight: 1.15,
        theme: {
          background: '#000000',
          foreground: '#d1d5db',
          cursor: '#22c55e',
          cursorAccent: '#000000',
          selectionBackground: 'rgba(56, 189, 248, 0.35)',
          black: '#000000',
          red: '#ef4444',
          green: '#22c55e',
          yellow: '#eab308',
          blue: '#38bdf8',
          magenta: '#c084fc',
          cyan: '#06b6d4',
          white: '#f9fafb',
          brightBlack: '#6b7280',
          brightRed: '#f87171',
          brightGreen: '#4ade80',
          brightYellow: '#fde047',
          brightBlue: '#60a5fa',
          brightMagenta: '#d8b4fe',
          brightCyan: '#22d3ee',
          brightWhite: '#ffffff'
        },
        convertEol: true,
        scrollback: 10000
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(container);
      setTimeout(() => fitAddon.fit(), 50);

      window.addEventListener('resize', () => {
        if (fitAddon) fitAddon.fit();
      });

      // Welcome Banner in native PuTTY style
      term.writeln('\x1b[1;36m======================================================================\x1b[0m');
      term.writeln('\x1b[1;32m  90FTP Native Terminal Window  (Win32 OS Window / xterm.js)\x1b[0m');
      term.writeln('\x1b[90m  Session: ' + currentUser + '@' + currentHost + ' | Directory: ' + currentCwd + '\x1b[0m');
      term.writeln('\x1b[1;36m======================================================================\x1b[0m\r\n');
      printPrompt();

      // Keyboard input
      term.onData(data => {
        if (isBusy) {
          if (data === '\u0003') {
            term.write('^C\r\n');
            printPrompt();
          }
          return;
        }

        if (data === '\r') {
          term.write('\r\n');
          const cmd = lineBuffer.trim();
          lineBuffer = '';
          historyIdx = -1;
          if (cmd) {
            commandHistory.push(cmd);
            runCommand(cmd);
          } else {
            printPrompt();
          }
        } else if (data === '\u007F') {
          if (lineBuffer.length > 0) {
            lineBuffer = lineBuffer.slice(0, -1);
            term.write('\b \b');
          }
        } else if (data === '\u0003') {
          term.write('^C\r\n');
          lineBuffer = '';
          historyIdx = -1;
          printPrompt();
        } else if (data === '\u000c') {
          term.clear();
          printPrompt();
        } else if (data === '\x1b[A') {
          if (commandHistory.length > 0) {
            if (historyIdx === -1) historyIdx = commandHistory.length - 1;
            else if (historyIdx > 0) historyIdx--;
            replaceCurrentLine(commandHistory[historyIdx] || '');
          }
        } else if (data === '\x1b[B') {
          if (historyIdx !== -1) {
            if (historyIdx < commandHistory.length - 1) {
              historyIdx++;
              replaceCurrentLine(commandHistory[historyIdx] || '');
            } else {
              historyIdx = -1;
              replaceCurrentLine('');
            }
          }
        } else if (data >= ' ' || data === '\t') {
          lineBuffer += data;
          term.write(data);
        }
      });
    }

    function printPrompt() {
      if (!term) return;
      const userColor = currentMode === 'remote' ? '\x1b[32m' : '\x1b[35m';
      const sep = currentMode === 'remote' ? '$' : '>';
      term.write(userColor + currentUser + '@' + currentHost + '\x1b[0m:\x1b[34m' + currentCwd + '\x1b[0m' + sep + ' ');
    }

    function replaceCurrentLine(newStr) {
      if (!term) return;
      while (lineBuffer.length > 0) {
        term.write('\b \b');
        lineBuffer = lineBuffer.slice(0, -1);
      }
      lineBuffer = newStr;
      term.write(newStr);
    }

    function sendIpc(action, payload) {
      const id = 'req_' + Math.random().toString(36).substring(2, 9);
      const msg = JSON.stringify({ id, action, payload });
      if (window.ipc && window.ipc.postMessage) {
        window.ipc.postMessage(msg);
      } else if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(msg);
      }
    }

    function runCommand(cmd) {
      if (cmd === 'clear') {
        term.clear();
        printPrompt();
        return;
      }
      isBusy = true;
      sendIpc('terminal_exec', {
        command: cmd,
        cwd: currentCwd,
        mode: currentMode,
        session_id: sessionId
      });
    }

    window.onTerminalStream = function(sId, text) {
      if (!term || !text) return;
      const clean = text.replace(/[\r\n]*__90FTP_PWD__[\s\S]*$/, '');
      if (clean) {
        term.write(clean.replace(/\r?\n/g, '\r\n'));
      }
    };

    window.onTerminalDone = function(sId, newCwd, exitCode) {
      isBusy = false;
      if (newCwd && newCwd.trim()) {
        currentCwd = newCwd.trim();
        document.title = currentUser + '@' + currentHost + ':' + currentCwd + ' - 90FTP Native Terminal';
      }
      if (term) {
        term.write('\r\n');
        printPrompt();
      }
    };

    // Auto-setup on load
    window.addEventListener('DOMContentLoaded', () => {
      setupXterm();
    });
  </script>
</body>
</html>
